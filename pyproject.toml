[project]
name = "stock-ai-local"
version = "0.1.0"
description = "Local, research-only stock forecasting and decision pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-lm==0.32.2",
  "timesfm[torch]==3.0.2",
  "chronos-forecasting==2.3.2",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "duckdb>=1,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "huggingface-hub>=1.5,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
